name: Build Android Debug APK

on:
  push:
    branches:
      - '**' # Triggers on a push to any branch
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub Actions tab

jobs:
  apk:
    name: Generate armeabi-v7a Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"

      - name: Build Only armeabi-v7a Debug APK
        run: ./gradlew :androidApp:assembleFossDebug -Pandroid.injected.abi=armeabi-v7a --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAI-9000-armv7a-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/*.apk
